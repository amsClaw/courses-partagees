<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liste de courses</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="liste" aria-labelledby="titre">
      <h1 id="titre">Ma liste de courses</h1>
      <form id="ajout" class="ajout" autocomplete="off">
        <label for="article">Ajouter un article</label>
        <div class="ajout-ligne">
          <input id="article" name="article" type="text" required maxlength="200">
          <button type="submit">Ajouter</button>
        </div>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <ul id="articles" class="articles" aria-label="Articles de la liste"></ul>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
